# Use alongside compose.yaml, not on its own.
services:
  web:
    environment:
      PUBLIC_DEMO: "1"
    restart: unless-stopped

  scheduler:
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy-data:
  caddy-config:
