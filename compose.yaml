name: mini-uptime-monitor

services:
  web:
    build: .
    image: mini-uptime-monitor:local
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8081}:8080"
    environment:
      DATABASE_PATH: /app/data/checks.db
      REQUEST_TIMEOUT: "5"
    volumes:
      - monitor-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  monitor-data:
