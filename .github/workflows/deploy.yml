name: Deploy Pulse to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character commit SHA of a successfully published main-branch image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pulse-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      INSTANCE_ID: i-07451294bf374f84c
      IMAGE_TAG: ${{ inputs.image_tag }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify image selection has successful main-branch CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Use the full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          # Only accept success from this repository's existing publishing workflow.
          gh api --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$IMAGE_TAG" -f branch=main -f status=success -f per_page=100 \
            > "$RUNNER_TEMP/pulse-ci-runs.json"
          jq -e --arg sha "$IMAGE_TAG" --arg repo "$REPOSITORY" '
            any(.workflow_runs[];
              .head_sha == $sha and .head_branch == "main" and
              .head_repository.full_name == $repo and .conclusion == "success" and
              (.event == "push" or .event == "workflow_dispatch"))
          ' "$RUNNER_TEMP/pulse-ci-runs.json" >/dev/null || {
            echo "No successful main-branch publishing CI run found for this commit." >&2
            exit 1
          }

      - name: Get temporary deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: arn:aws:iam::944464821297:role/mini-uptime-monitor-github-deployer
          aws-region: eu-north-1
          allowed-account-ids: '944464821297'
          role-session-name: pulse-deploy-${{ github.run_id }}

      - name: Request deployment and wait for verification
        shell: bash
        run: |
          set -euo pipefail
          parameters=$(jq -cn --arg tag "$IMAGE_TAG" '{ImageTag:[$tag]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name mini-uptime-monitor-deploy --document-version '1' \
            --parameters "$parameters" --timeout-seconds 60 \
            --comment "Pulse deployment from GitHub Actions" \
            --region "$AWS_REGION" --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          {
            echo '### Pulse deployment request'
            echo "Image tag: \`$IMAGE_TAG\`"
            echo "Instance: \`$INSTANCE_ID\`"
            echo "SSM command: \`$command_id\` (document version 1)"
          } >> "$GITHUB_STEP_SUMMARY"

          # SSM results may not be visible immediately after SendCommand.
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            if aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" --output json \
                > "$RUNNER_TEMP/pulse-deployment.json" 2> "$RUNNER_TEMP/pulse-ssm-error"; then
              status=$(jq -r '.Status' "$RUNNER_TEMP/pulse-deployment.json")
              echo "Deployment status: $status"
              case "$status" in
                Success|Failed|Cancelled|TimedOut)
                  jq -r '.StandardOutputContent, .StandardErrorContent' "$RUNNER_TEMP/pulse-deployment.json"
                  echo "Result: **$status**" >> "$GITHUB_STEP_SUMMARY"
                  if [[ "$status" == Success ]] &&
                      jq -e '.ResponseCode == 0' "$RUNNER_TEMP/pulse-deployment.json" >/dev/null; then
                    exit 0
                  fi
                  exit 1
                  ;;
                Pending|InProgress|Delayed|Cancelling) ;;
                *) echo "Unexpected SSM status: $status" >&2; exit 1 ;;
              esac
            elif ! grep -q 'InvocationDoesNotExist' "$RUNNER_TEMP/pulse-ssm-error"; then
              cat "$RUNNER_TEMP/pulse-ssm-error" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting. Inspect SSM command $command_id before requesting another deployment." >&2
          echo 'Result: **Waiting timed out; inspect the SSM command.**' >> "$GITHUB_STEP_SUMMARY"
          exit 1
