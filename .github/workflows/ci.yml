name: Python tests and Docker build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the five application tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build --tag mini-uptime-monitor:ci .

      - name: Run tests inside the Docker image
        run: docker run --rm mini-uptime-monitor:ci python -m unittest discover -s tests -v
